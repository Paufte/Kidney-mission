<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040a1c">
<title>Kidney Mission · Trasplantaments</title>
<meta name="description" content="Donació i trasplantament d'òrgans: història, dades i mites. Donación y trasplante de órganos. Organ donation and transplantation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040a1c;--panel:#0b1736;--panel2:#0f1f47;--line:rgba(96,170,255,.22);--tq:#22e4c8;--blue:#2f7bff;--txt:#eef5ff;--mut:#9fb3d1;--gold:#ffc857;--rose:#ff7a9a;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;--f-body:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:radial-gradient(70% 30% at 90% 0%,rgba(47,123,255,.22),transparent 70%),radial-gradient(60% 30% at 0% 18%,rgba(34,228,200,.12),transparent 70%),
 linear-gradient(rgba(96,170,255,.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(96,170,255,.045) 1px,transparent 1px) 0 0/28px 28px,var(--bg);
 color:var(--txt);font-family:var(--f-body);line-height:1.55;font-size:16px}
a{color:var(--tq)}
:focus-visible{outline:2px solid var(--tq);outline-offset:2px}

/* Barra superior: logo + selector d'idioma */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(env(safe-area-inset-top) + 10px);
 background:rgba(4,10,28,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-disp);font-weight:700;letter-spacing:.08em;font-size:15px;color:var(--txt);text-decoration:none;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:26px}
.langs{margin-left:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px}
.langs button{font:600 13px var(--f-disp);letter-spacing:.08em;color:var(--mut);background:none;border:0;border-radius:99px;padding:6px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:linear-gradient(100deg,var(--tq),var(--blue));color:#03122a}

main{max-width:760px;margin:0 auto;padding:0 18px calc(env(safe-area-inset-bottom) + 30px)}
section{padding:46px 0 10px}
.eb{font-family:var(--f-disp);font-size:12px;letter-spacing:.2em;color:var(--tq);text-transform:uppercase}
h1{font-family:var(--f-disp);font-size:clamp(36px,10vw,60px);line-height:.98;letter-spacing:.03em;margin:10px 0 14px}
h1 span{display:block;background:linear-gradient(90deg,var(--tq),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--f-disp);font-size:clamp(26px,7vw,36px);line-height:1.05;letter-spacing:.03em;margin:6px 0 10px}
.lead{color:var(--mut);font-size:17px;max-width:56ch}
p+p{margin-top:10px}
.note{font-size:13px;color:var(--mut);margin-top:12px}

/* Hero */
.hero{padding-top:34px;text-align:left}
.hero-kid{width:130px;height:150px;float:right;margin:0 0 6px 10px;filter:drop-shadow(0 0 24px rgba(34,228,200,.45))}
.pulse{stroke-dasharray:160;stroke-dashoffset:160;animation:draw 2.6s ease-in-out infinite}
@keyframes draw{50%{stroke-dashoffset:0}100%{stroke-dashoffset:-160}}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;clear:both}
.jump a{font-size:13.5px;text-decoration:none;color:var(--txt);border:1px solid var(--line);background:rgba(11,23,54,.8);padding:7px 12px;border-radius:99px}

/* Xifres grans */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
.stat{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px}
.stat b{display:block;font-family:var(--f-disp);font-size:clamp(28px,8vw,38px);line-height:1;color:var(--txt)}
.stat b em{font-style:normal;font-size:.5em;color:var(--tq);margin-left:3px}
.stat>span{display:block;font-size:13px;color:var(--mut);margin-top:6px}
.stat.hl{grid-column:1/-1;background:linear-gradient(100deg,rgba(34,228,200,.16),rgba(47,123,255,.16));border-color:rgba(34,228,200,.4)}
.src{font-size:12px;color:var(--mut);margin-top:8px}

/* Ronyó: funcions */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.card .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(34,228,200,.12);color:var(--tq);margin-bottom:10px}
.card .ic svg{width:22px;height:22px}
.card h3{font-family:var(--f-disp);font-size:17px;letter-spacing:.03em;margin-bottom:4px}
.card p{font-size:14.5px;color:var(--mut)}

/* Tractaments */
.treat{display:grid;gap:10px;margin-top:18px}
.tr{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.tr .n{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;background:rgba(47,123,255,.16);color:#8fb8ff}
.tr.best{border-color:rgba(34,228,200,.45);background:linear-gradient(100deg,rgba(34,228,200,.12),var(--panel))}
.tr.best .n{background:var(--tq);color:#03122a}
.tr h3{font-family:var(--f-disp);font-size:17px;margin-bottom:3px}
.tr p{font-size:14.5px;color:var(--mut)}

/* Línia del temps */
.tl{position:relative;margin-top:22px;padding-left:30px}
.tl:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--tq),var(--blue),rgba(47,123,255,.1));border-radius:2px}
.ev{position:relative;margin-bottom:16px;opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.ev.in{opacity:1;transform:none}
.ev:before{content:"";position:absolute;left:-27px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--tq);box-shadow:0 0 12px rgba(34,228,200,.6)}
.ev.cat:before{border-color:var(--gold);box-shadow:0 0 12px rgba(255,200,87,.6)}
.ev.world:before{border-color:#8fb8ff;box-shadow:0 0 12px rgba(143,184,255,.5)}
.ev .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ev .yr{font-family:var(--f-disp);font-weight:700;font-size:26px;line-height:1;color:var(--tq)}
.ev.cat .yr{color:var(--gold)}.ev.world .yr{color:#8fb8ff}
.ev .tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.ev h3{font-family:var(--f-disp);font-size:17px;margin:6px 0 3px;letter-spacing:.02em}
.ev p{font-size:14.5px;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mut);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:3px solid;margin-right:6px;vertical-align:-1px}

/* Procés */
.steps{counter-reset:s;display:grid;gap:10px;margin-top:18px}
.step{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 62px;min-height:64px}
.step:before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 17px var(--f-disp);background:linear-gradient(140deg,var(--tq),var(--blue));color:#03122a}
.step h3{font-family:var(--f-disp);font-size:17px;margin-bottom:3px}
.step p{font-size:14.5px;color:var(--mut)}

/* Tipus de donació */
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:18px}
.type{border-radius:16px;padding:16px;border:1px solid var(--line);background:var(--panel)}
.type h3{font-family:var(--f-disp);font-size:19px;margin-bottom:8px}
.type ul{list-style:none;display:grid;gap:8px}
.type li{font-size:14.5px;color:var(--mut);padding-left:16px;position:relative}
.type li:before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--tq)}
.type li b{color:var(--txt);font-weight:600}

/* Gràfics de barres (una sola sèrie: un color) */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.chart h3{font-family:var(--f-disp);font-size:17px;margin-bottom:2px}
.chart .sub{font-size:13px;color:var(--mut);margin-bottom:12px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:7.6em 1fr auto;align-items:center;gap:10px;font-size:14px;position:relative}
.bar .lb{color:var(--txt);line-height:1.2}
.bar .tk{display:block;height:16px;border-radius:0 4px 4px 0;background:rgba(96,170,255,.08)}
.bar .fl{display:block;height:100%;width:0;border-radius:0 4px 4px 0;background:var(--blue);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.me .fl{background:var(--tq)}
.bar .vl{font-family:var(--f-disp);font-weight:600;color:var(--txt);min-width:4ch;text-align:right}
.bar .tip{position:absolute;right:0;bottom:calc(100% + 4px);background:#02081a;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--txt);opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
.bar:hover .tip,.bar:focus .tip{opacity:1}
details.tbl{margin-top:10px;font-size:13px;color:var(--mut)}
details.tbl summary{cursor:pointer}
details.tbl table{border-collapse:collapse;margin-top:6px;width:100%}
details.tbl td,details.tbl th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
details.tbl td:last-child,details.tbl th:last-child{text-align:right}

/* Figura: donant -> òrgans */
.organs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.org{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.org b{display:block;font-family:var(--f-disp);font-size:22px}
.org span{font-size:12.5px;color:var(--mut)}

/* Mites (targetes que es giren) */
.myths{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:18px}
.myth{display:block;width:100%;perspective:900px;min-height:190px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;font:inherit;padding:0}
.myth .in{display:block;position:relative;width:100%;height:100%;min-height:190px;transition:transform .55s;transform-style:preserve-3d}
.myth[aria-expanded="true"] .in{transform:rotateY(180deg)}
.myth .f,.myth .b{position:absolute;inset:0;border-radius:16px;padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.myth .f{background:linear-gradient(160deg,var(--panel2),var(--panel))}
.myth .b{background:linear-gradient(160deg,rgba(34,228,200,.18),var(--panel));transform:rotateY(180deg);border-color:rgba(34,228,200,.4)}
.myth .q,.myth .k,.myth .hint{display:block}
.myth .q{font-family:var(--f-disp);font-size:18px;line-height:1.2}
.myth .k{font-family:var(--f-disp);font-size:13px;letter-spacing:.14em;color:var(--rose);margin-bottom:8px}
.myth .b .k{color:var(--tq)}
.myth .b p{font-size:14px;color:var(--txt)}
.myth .hint{margin-top:auto;font-size:12.5px;color:var(--mut)}

/* Com fer-se donant */
.cta{margin-top:18px;border-radius:20px;padding:20px;background:linear-gradient(120deg,rgba(34,228,200,.18),rgba(47,123,255,.18));border:1px solid rgba(34,228,200,.4)}
.cta ol{margin:12px 0 0 20px;display:grid;gap:8px}
.cta li{font-size:15px}
.btns{display:grid;gap:10px;margin-top:16px}
a.b{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--txt);padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(11,23,54,.9)}
a.b.p{background:linear-gradient(100deg,var(--tq),var(--blue));color:#03122a;border:0;font-weight:600}
a.b b{font-family:var(--f-disp);letter-spacing:.05em;font-size:16px}
a.b .ar{margin-left:auto;opacity:.7}

.srcs{font-size:13px;color:var(--mut);display:grid;gap:6px;margin-top:12px;padding-left:18px}
footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}.stat.hl{grid-column:span 2}.organs{grid-template-columns:repeat(6,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.ev{opacity:1;transform:none}.pulse{stroke-dashoffset:0}}
</style>
</head>

<header>
 <a class="brand" href="#top"><svg viewBox="0 0 120 140" aria-hidden="true"><path d="M66 8C30 6 10 36 12 72s24 62 54 60c26-2 34-24 22-40-8-10-8-26 0-36C102 38 98 10 66 8z" fill="rgba(34,228,200,.15)" stroke="#22e4c8" stroke-width="8"/></svg>KIDNEY MISSION</a>
 <nav class="langs" aria-label="Idioma · Language">

 </nav>

<main id="top">
 <section class="hero">

   <path d="M66 8C30 6 10 36 12 72s24 62 54 60c26-2 34-24 22-40-8-10-8-26 0-36C102 38 98 10 66 8z" fill="rgba(34,228,200,.08)" stroke="url(#kg)" stroke-width="4"/>
   <path d="M80 64c-10 2-16 8-24 8M80 84c-10-2-16-8-24-8" fill="none" stroke="url(#kg)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
   <path class="pulse" d="M4 74h26l6-14 9 30 8-24 6 8h57" fill="none" stroke="#eef5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <div class="cards" id="kcards"></div>
 </section>

 <section id="tractament">
  <div class="eb" data-t="tEb"></div>

 </section>

 <section id="historia">
  <div class="eb" data-t="hEb"></div>
  <h2 data-t="hH"></h2>

  <div class="legend" id="tlLegend"></div>
  <div class="tl" id="tl"></div>
 </section>

 <section id="proces">
  <div class="eb" data-t="pEb"></div>

 </section>

 <section id="tipus">
  <div class="eb" data-t="dEb"></div>
  <h2 data-t="dH"></h2>

 </section>

 <section id="dades">
  <div class="eb" data-t="nEb"></div>
  <h2 data-t="nH"></h2>

  <p class="src" data-t="organsSrc"></p>

  <div class="chart" id="c2"></div>
 </section>

 <section id="mites">
  <div class="eb" data-t="mEb"></div>

 </section>

 <section id="donant">

  </div>

 </section>

 <section id="fonts">
  <div class="eb" data-t="sEb"></div>
  <ul class="srcs" id="srcs"></ul>
  <footer data-t="foot"></footer>
 </section>
</main>

 tEb:"02 · Cuando el riñón falla",tH:"Tres opciones de tratamiento",

 tr:[["Hemodiálisis","Una máquina filtra la sangre. Normalmente, sesiones de unas 4 horas, tres veces por semana.",0],["Diálisis peritoneal","Se hace en casa, usando el peritoneo (una membrana del abdomen) como filtro.",0],["Trasplante renal","Para muchas personas es el mejor tratamiento: más calidad y esperanza de vida que la diálisis, y más libertad. Hay que tomar medicación inmunosupresora toda la vida.",1]],

  ["world",1954,"Primer trasplante de riñón con éxito","Boston (EE. UU.). El equipo de Joseph Murray trasplanta un riñón entre gemelos idénticos, Ronald y Richard Herrick. Al ser genéticamente iguales, no hubo rechazo."],
  ["cat",1965,"El primero en España, en Barcelona","El 23 de julio, en el Hospital Clínic de Barcelona, el equipo de Josep Maria Gil-Vernet y Antoni Caralps realiza el primer trasplante renal con éxito de España."],
  ["world",1967,"El primer trasplante de corazón","Ciudad del Cabo (Sudáfrica). Christiaan Barnard lo hace posible y el mundo descubre los trasplantes."],

  ["cat",1984,"Hígado y corazón, también en Barcelona","En febrero, primer trasplante de hígado de España; en mayo, el primero de corazón, en el Hospital de Sant Pau."],

  ["",1992,"Líderes mundiales","España se convierte en el país con más donantes por millón de habitantes del mundo, y lo sigue siendo más de 30 años después."],
  ["cat",2009,"Primer trasplante cruzado","En el Clínic de Barcelona se hace el primer trasplante renal cruzado de España: dos parejas incompatibles intercambian sus donantes. La ONT pone en marcha el programa nacional."],
  ["",2012,"Donación en asistolia controlada","Una nueva normativa permite la donación tras una parada cardiaca controlada. Hoy ya supone más de la mitad de los donantes."],
  ["cat",2015,"Cirugía robótica","El Hospital Clínic realiza su primer trasplante renal asistido por robot, con incisiones más pequeñas y una recuperación más rápida."],

 pEb:"04 · El proceso",pH:"Del donante al receptor",pP:"Una donación moviliza a decenas de profesionales en pocas horas.",
 st:[["Se certifica la muerte","Solo se puede donar tras la muerte, en muerte encefálica o por parada cardiorrespiratoria (asistolia). La certifican médicos que no forman parte del equipo de trasplante."],["La familia habla con los coordinadores","Los coordinadores de trasplante explican el proceso y respetan la voluntad de la persona fallecida."],["Asignación","Según criterios clínicos y de compatibilidad (grupo sanguíneo, tamaño, tiempo en lista, urgencia), se eligen los receptores."],["Extracción y transporte","Los órganos se extraen en quirófano y se trasladan por carretera o por aire; el tiempo es clave."],["El trasplante","El cirujano implanta el órgano. Un riñón suele colocarse en la parte baja del abdomen, y los propios no siempre se quitan."],["Seguimiento de por vida","El receptor toma inmunosupresores para evitar el rechazo y hace controles médicos periódicos."]],

en:{
 title:"Kidney Mission · Organ donation and transplantation",
 heroEb:"Info site · Donation and transplantation",
 heroH:"One decision<span>can save lives</span>",
 heroP:"How kidneys work, the history of transplantation, what happens in a donation, and why Spain and Catalonia lead the world.",
 jump:[["#ronyo","The kidney"],["#historia","History"],["#proces","The process"],["#dades","Data"],["#mites","Myths"],["#donant","Become a donor"]],
 stats:[[6335,"","organ transplants in Spain in 2025",1],[17,"/day","transplants on average every day in Spain"],[51.9,"pmp","deceased donors per million people in Spain"],[945,"","kidney transplants in Catalonia in 2025"],[5163,"","people on Spain's waiting list (31 Dec 2025)"]],
 statsSrc:"Sources: ONT 2025 report; OCATT 2025 report. pmp = per million population.",
 kEb:"01 · The kidney",kH:"A filter the size of a fist",
 kP:"We have two kidneys, one on each side of the spine. Each weighs about 150 grams, and together they filter around 180 litres of plasma a day to make 1 to 2 litres of urine.",
 kc:[["drop","Cleans the blood","Removes waste such as urea and creatinine."],["scale","Balances water and salts","Regulates sodium, potassium and fluid volume."],["heart","Controls blood pressure","Helps regulate blood pressure."],["cell","Makes hormones","Produces erythropoietin, which drives red blood cell production, and activates vitamin D for the bones."]],
 tEb:"02 · When kidneys fail",tH:"Three treatment options",
 tP:"When chronic kidney disease reaches its final stage, the kidneys can no longer do their job, and it has to be replaced.",
 tr:[["Haemodialysis","A machine filters the blood, usually in sessions of about 4 hours, three times a week.",0],["Peritoneal dialysis","Done at home, using the peritoneum (a membrane in the abdomen) as a filter.",0],["Kidney transplant","For many people it is the best treatment: better quality of life and life expectancy than dialysis, and more freedom. Immunosuppressive medication is needed for life.",1]],
 hEb:"03 · History",hH:"Transplant timeline",hP:"From the first successes to today's programmes. Scroll to explore.",
 lg:[["world","World"],["","Spain"],["cat","Catalonia"]],
 tl:[
  ["world",1954,"First successful kidney transplant","Boston (USA). Joseph Murray's team transplants a kidney between identical twins, Ronald and Richard Herrick. Being genetically identical, there was no rejection."],
  ["cat",1965,"Spain's first, in Barcelona","On 23 July, at Hospital Clínic de Barcelona, the team of Josep Maria Gil-Vernet and Antoni Caralps performs Spain's first successful kidney transplant."],
  ["world",1967,"The first heart transplant","Cape Town (South Africa). Christiaan Barnard makes it happen and the world discovers transplantation."],
  ["",1979,"The transplant law","Law 30/1979 sets the principles still in force today: donation is altruistic, free and anonymous."],
  ["world",1983,"Ciclosporin","This immunosuppressive drug greatly reduces rejection and boosts transplant success worldwide."],
  ["cat",1984,"Liver and heart, also in Barcelona","In February, Spain's first liver transplant; in May, its first heart transplant, at Hospital de Sant Pau."],
  ["",1989,"The ONT is born","Spain's National Transplant Organisation starts operating and builds the \"Spanish model\", with transplant coordinators in every hospital."],
  ["world",1990,"Nobel Prize","Joseph Murray wins the Nobel Prize in Medicine for his work on organ transplantation."],
  ["",1992,"World leaders","Spain becomes the country with the most donors per million people in the world, and still is more than 30 years later."],
  ["cat",2009,"First kidney paired exchange","Hospital Clínic de Barcelona performs Spain's first paired (cross-over) kidney transplant: two incompatible pairs swap donors. The ONT launches the national programme."],
  ["",2012,"Controlled donation after circulatory death","New regulations allow donation after a controlled cardiac arrest. Today it accounts for more than half of all donors."],
  ["cat",2015,"Robotic surgery","Hospital Clínic performs its first robot-assisted kidney transplant, with smaller incisions and faster recovery."],
  ["",2025,"Heart record and 6,335 transplants","Spain exceeds 6,300 transplants for the second year running, with a record number of heart transplants (390). Catalonia performs 1,356."]
 ],
 pEb:"04 · The process",pH:"From donor to recipient",pP:"A single donation mobilises dozens of professionals within a few hours.",
 st:[["Death is certified","Donation is only possible after death, either brain death or circulatory death. Death is certified by doctors who are not part of the transplant team."],["The family meets the coordinators","Transplant coordinators explain the process and respect the wishes of the person who has died."],["Allocation","Recipients are chosen by clinical and compatibility criteria (blood group, size, time on the list, urgency)."],["Retrieval and transport","Organs are retrieved in the operating theatre and moved by road or air; time is critical."],["The transplant","The surgeon implants the organ. A kidney is usually placed in the lower abdomen, and the patient's own kidneys are not always removed."],["Lifelong follow-up","The recipient takes immunosuppressants to prevent rejection and has regular check-ups."]],
 dEb:"05 · Types of donation",dH:"Who can donate?",
 ty:[["After death",[["Brain death:","the brain has irreversibly stopped working."],["Circulatory death:","after cardiac arrest. In Spain it is now 56% of donors."],["One person","can donate kidneys, liver, heart, lungs, pancreas and intestine, plus tissues such as corneas, bone or skin."]]],["While alive",[["A kidney or part of the liver:","usually between relatives or people with a close bond."],["You can live with one kidney:","the donor first goes through a very thorough medical assessment."],["Paired exchange:","if a pair is incompatible, they swap donors with another pair."]]]],
 nEb:"06 · Data",nH:"The 2025 figures",nP:"The kidney is the most transplanted organ, in Spain and worldwide.",
 org:[[3999,"Kidney"],[1276,"Liver"],[556,"Lung"],[390,"Heart"],[103,"Pancreas"],[11,"Intestine"]],
 organsSrc:"Transplants in Spain in 2025, by organ (ONT).",
 c1:["Donors per million people","The world's top three countries, 2025","Country","Donors pmp",[["Spain",53.2,1],["United States",47.7],["Iceland",37.5]],"Global Observatory on Donation and Transplantation (2025 data). Spain's figure differs slightly from the ONT's (51.9) because it uses UN population data."],
 c2:["Transplants in Catalonia","2025, by organ","Organ","Transplants",[["Kidney",945,1],["Liver",206],["Lung",110],["Heart",68],["Pancreas",27]],"OCATT 2025 report: 1,356 transplants in total and 370 deceased donors."],
 tbl:"View as table",
 mEb:"07 · Myths",mH:"Myth or fact?",mP:"Tap each card to flip it.",
 my:[["\"If I'm a donor, doctors won't try as hard to save me.\"","False. The team treating you and the transplant team are separate. Donation is only considered once death has been certified."],["\"I'm too old to donate.\"","False. There is no upper age limit: in 2025 Spain had a 93-year-old donor. Doctors assess each organ."],["\"Most donors die in road accidents.\"","False. In 2025 they were only 3% of donors in Spain. The most common cause is stroke."],["\"You can get paid for donating an organ.\"","False. Donation is altruistic, free and anonymous, and organ trafficking is a crime."],["\"You can't live normally with one kidney.\"","False. Living donors lead normal lives, with medical check-ups. In 2025, 402 people in Spain donated a kidney while alive."],["\"If I never said anything, the hospital decides.\"","In practice the family is always consulted and respects your wishes. That is why it matters to share them."]],
 flip:"Tap to see the answer",fact:"ANSWER",myth:"MYTH?",
 cEb:"08 · Become a donor",cH:"Talk about it today",
 cP:"In Spain you don't need to register to be a donor, but the family is always consulted. In Catalonia in 2025, nearly 3 in 10 families said no, often because they did not know what their relative wanted.",
 cs:["Tell your family and friends that you want to be a donor.","If you like, get a donor card (ONT or OCATT). It has no legal value, but it makes your decision visible.","In Catalonia, you can also put it in writing in an advance directive (Document de Voluntats Anticipades)."],

 ["Matesanz R. «La pequeña gran historia del trasplante renal en España». Nefrología al Día, 2024","https://nefrologiaaldia.org/monografia/la-pequena-gran-historia-del-trasplante-renal-en-espana/"]
];
var ICONS={
 drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg>',
 scale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 21h14M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/><path d="M3 12h4l2-3 3 6 2-3h7"/></svg>',
 cell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>'
};
var L='ca',io;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return n.toLocaleString(L==='en'?'en-GB':(L==='es'?'es-ES':'ca-ES'),{maximumFractionDigits:1,useGrouping:true})}
function $(id){return document.getElementById(id)}
function chart(el,c){
 var max=Math.max.apply(null,c[4].map(function(r){return r[1]}));
 el.innerHTML='<h3>'+esc(c[0])+'</h3><div class="sub">'+esc(c[1])+'</div><div class="bars">'+c[4].map(function(r){
  return '<div class="bar'+(r[2]?' me':'')+'" tabindex="0"><span class="lb">'+esc(r[0])+'</span><span class="tk"><span class="fl" data-w="'+(r[1]/max*100)+'"></span></span><span class="vl">'+fmt(r[1])+'</span><span class="tip">'+esc(r[0])+': '+fmt(r[1])+' '+esc(c[3].toLowerCase())+'</span></div>'}).join('')+
  '</div><p class="src">'+esc(c[5])+'</p><details class="tbl"><summary>'+esc(I[L].tbl)+'</summary><table><tr><th>'+esc(c[2])+'</th><th>'+esc(c[3])+'</th></tr>'+c[4].map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+fmt(r[1])+'</td></tr>'}).join('')+'</table></details>';
}
function render(l){
 L=I[l]?l:'ca';var t=I[L];
 document.documentElement.lang=L;document.title=t.title;
 document.querySelectorAll('[data-t]').forEach(function(e){var v=t[e.getAttribute('data-t')];if(e.hasAttribute('data-html'))e.innerHTML=v;else e.textContent=v});
 document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===L)});
 $('jump').innerHTML=t.jump.map(function(j){return '<a href="'+j[0]+'">'+esc(j[1])+'</a>'}).join('');
 $('stats').innerHTML=t.stats.map(function(s){return '<div class="stat'+(s[3]?' hl':'')+'"><b><span class="cnt" data-v="'+s[0]+'">'+fmt(s[0])+'</span>'+(s[1]?'<em>'+esc(s[1])+'</em>':'')+'</b><span>'+esc(s[2])+'</span></div>'}).join('');
 $('kcards').innerHTML=t.kc.map(function(c){return '<div class="card"><div class="ic">'+ICONS[c[0]]+'</div><h3>'+esc(c[1])+'</h3><p>'+esc(c[2])+'</p></div>'}).join('');
 $('treat').innerHTML=t.tr.map(function(r,i){return '<div class="tr'+(r[2]?' best':'')+'"><span class="n">'+(i+1)+'</span><div><h3>'+esc(r[0])+'</h3><p>'+esc(r[1])+'</p></div></div>'}).join('');
 $('tlLegend').innerHTML=t.lg.map(function(g){var c=g[0]==='world'?'#8fb8ff':g[0]==='cat'?'#ffc857':'#22e4c8';return '<span><i style="border-color:'+c+'"></i>'+esc(g[1])+'</span>'}).join('');
 var lgName={};t.lg.forEach(function(g){lgName[g[0]]=g[1]});
 $('tl').innerHTML=t.tl.map(function(e){return '<div class="ev '+e[0]+'"><div class="box"><span class="yr">'+e[1]+'</span><span class="tag">'+esc(lgName[e[0]])+'</span><h3>'+esc(e[2])+'</h3><p>'+esc(e[3])+'</p></div></div>'}).join('');
 $('steps').innerHTML=t.st.map(function(s){return '<div class="step"><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div>'}).join('');
 $('types').innerHTML=t.ty.map(function(y){return '<div class="type"><h3>'+esc(y[0])+'</h3><ul>'+y[1].map(function(i){return '<li><b>'+esc(i[0])+'</b> '+esc(i[1])+'</li>'}).join('')+'</ul></div>'}).join('');
 $('organs').innerHTML=t.org.map(function(o){return '<div class="org"><b>'+fmt(o[0])+'</b><span>'+esc(o[1])+'</span></div>'}).join('');
 chart($('c1'),t.c1);chart($('c2'),t.c2);
 $('myths').innerHTML=t.my.map(function(m){return '<button class="myth" aria-expanded="false"><span class="in"><span class="f"><span class="k">'+esc(t.myth)+'</span><span class="q">'+esc(m[0])+'</span><span class="hint">↻ '+esc(t.flip)+'</span></span><span class="b"><span class="k">'+esc(t.fact)+'</span><p>'+esc(m[1])+'</p></span></span></button>'}).join('');
 $('cSteps').innerHTML=t.cs.map(function(c){return '<li>'+esc(c)+'</li>'}).join('');
 $('btns').innerHTML=t.b.map(function(b){var ext=/^https/.test(b[0]);return '<a class="b'+(b[2]?' p':'')+'" href="'+b[0]+'"'+(ext?' target="_blank" rel="noopener"':'')+'><b>'+esc(b[1])+'</b><span class="ar">'+(ext?'↗':'→')+'</span></a>'}).join('');
 $('srcs').innerHTML=SRC.map(function(s){return '<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>'}).join('');
 observe();
}
function observe(){
 var els=document.querySelectorAll('.ev,.chart,.stats');
 if(!('IntersectionObserver' in window)){els.forEach(show);return}
 if(io)io.disconnect();
 io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){show(x.target);io.unobserve(x.target)}})},{threshold:.2});
 els.forEach(function(e){io.observe(e)});
}
function show(el){
 el.classList.add('in');
 el.querySelectorAll('.fl').forEach(function(f){f.style.width=f.dataset.w+'%'});
 if(el.classList.contains('stats')&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  el.querySelectorAll('.cnt').forEach(function(c){var v=+c.dataset.v,t0=null;function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/1200),e=1-Math.pow(1-p,3);c.textContent=fmt(v%1?Math.round(v*e*10)/10:Math.round(v*e));if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)});
 }
}
document.addEventListener('click',function(e){
 var b=e.target.closest('.langs button');
 if(b){render(b.dataset.l);try{localStorage.setItem('km-info-lang',L)}catch(_){}history.replaceState(null,'','#'+L);return}
 var m=e.target.closest('.myth');if(m)m.setAttribute('aria-expanded',m.getAttribute('aria-expanded')!=='true');
});
(function(){
 var h=(location.hash||'').slice(1),s=null;try{s=localStorage.getItem('km-info-lang')}catch(_){}
 var n=(navigator.language||'').slice(0,2).toLowerCase();
 render(I[h]?h:(I[s]?s:(I[n]?n:'ca')));
})();
</script>
