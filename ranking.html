<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidney Mission · Ranking en directo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a1c;--panel:#0b1736;--line:rgba(96,170,255,.2);--tq:#22e4c8;--blue:#2f7bff;--txt:#eef5ff;--mut:#93a8c8;--gold:#ffc857;--silver:#cfd8e6;--bronze:#e0995e;
--fd:"Chakra Petch",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(60% 45% at 90% 0%,rgba(47,123,255,.28),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(34,228,200,.18),transparent 70%),
linear-gradient(rgba(96,170,255,.05) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(96,170,255,.05) 1px,transparent 1px) 0 0/32px 32px,var(--bg);
color:var(--txt);font-family:var(--fb);overflow-x:hidden}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,26vw,420px);gap:clamp(20px,3vw,48px);padding:clamp(16px,3vw,48px)}
h1{font-family:var(--fd);font-size:clamp(34px,4.6vw,76px);line-height:.95;letter-spacing:.04em}
h1 span{background:linear-gradient(90deg,var(--tq),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.eb{font-family:var(--fd);letter-spacing:.24em;font-size:clamp(12px,1vw,16px);color:var(--tq);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.live{width:10px;height:10px;border-radius:50%;background:#ff4d6a;box-shadow:0 0 0 0 rgba(255,77,106,.6);animation:live 1.6s infinite}
@keyframes live{70%{box-shadow:0 0 0 12px rgba(255,77,106,0)}100%{box-shadow:0 0 0 0 rgba(255,77,106,0)}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:clamp(14px,2vw,28px)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:12px;background:rgba(11,23,54,.8)}
.tabs button{font:600 15px var(--fd);letter-spacing:.08em;color:var(--mut);background:none;border:0;padding:8px 16px;border-radius:9px;cursor:pointer}
.tabs button.on{background:linear-gradient(100deg,var(--tq),var(--blue));color:#03122a}
.list{display:flex;flex-direction:column;gap:clamp(6px,.7vw,10px)}
.r{display:grid;grid-template-columns:clamp(44px,4vw,70px) minmax(0,1fr) auto auto;gap:clamp(10px,1.4vw,24px);align-items:center;padding:clamp(10px,1vw,16px) clamp(14px,1.4vw,24px);
border-radius:16px;border:1px solid var(--line);background:rgba(11,23,54,.82);font-size:clamp(17px,1.7vw,28px);transition:transform .5s}
.r .p{font-family:var(--fd);font-weight:700;font-size:1.15em;color:var(--mut);text-align:center}
.r .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .a{color:var(--mut);font-size:.68em;font-variant-numeric:tabular-nums}
.r .s{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums;color:var(--tq)}
.r.g1{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,200,87,.16),rgba(11,23,54,.85) 60%)}.r.g1 .p{color:var(--gold)}
.r.g2{border-color:rgba(207,216,230,.6)}.r.g2 .p{color:var(--silver)}
.r.g3{border-color:rgba(224,153,94,.6)}.r.g3 .p{color:var(--bronze)}
.r.new{animation:flash 2.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--tq),0 0 40px rgba(34,228,200,.7);transform:scale(1.02)}100%{box-shadow:none;transform:none}}
.empty{padding:40px;text-align:center;color:var(--mut);font-size:clamp(18px,1.6vw,26px);border:1px dashed var(--line);border-radius:16px}
.side{display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border-radius:28px;padding:clamp(16px,1.6vw,26px);box-shadow:0 0 0 8px rgba(34,228,200,.16),0 0 60px rgba(34,228,200,.3)}
.cta{font:700 clamp(20px,2vw,32px) var(--fd);letter-spacing:.12em;text-align:center;padding:14px;border-radius:16px;background:linear-gradient(100deg,var(--tq),var(--blue));color:#03122a}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat div{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(11,23,54,.82)}
.stat small{display:block;font-size:12px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.stat b{font:700 clamp(26px,2.4vw,40px) var(--fd);font-variant-numeric:tabular-nums}
.foot{font-size:13px;color:var(--mut)}
.err{color:#ff8a9c}
@media (max-width:760px){.wrap{grid-template-columns:1fr}.side{order:-1}.card{max-width:260px;margin:0 auto}.r .a{display:none}.r{grid-template-columns:44px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>

<script>
const CFG=window.KM_CFG||{};
const H={apikey:CFG.key};if(/^eyJ/.test(CFG.key||''))H.Authorization='Bearer '+CFG.key;
let mode='hoy',seen=null;
const TX={es:{live:'RANKING EN DIRECTO',hoy:'HOY',total:'TOTAL',loading:'Cargando ranking…',cta:'ESCANEA Y JUEGA',games:'Partidas',record:'Récord',foot:'Se actualiza cada 5 segundos. Juego divulgativo sobre donación y trasplante renal. Casos ficticios.',noconf:'Falta configurar Supabase en config.js.',notconf:'Ranking no configurado.',emptyToday:'Todavía no hay partidas hoy. ¡Escanea el QR y estrena el ranking!',empty:'Todavía no hay partidas.',offline:'Sin conexión con el ranking. Reintentando…',title:'Kidney Mission · Ranking en directo'},
 ca:{live:'RÀNQUING EN DIRECTE',hoy:'AVUI',total:'TOTAL',loading:'Carregant el rànquing…',cta:'ESCANEJA I JUGA',games:'Partides',record:'Rècord',foot:'S\'actualitza cada 5 segons. Joc divulgatiu sobre donació i trasplantament renal. Casos ficticis.',noconf:'Falta configurar Supabase a config.js.',notconf:'Rànquing no configurat.',emptyToday:'Encara no hi ha partides avui. Escaneja el QR i estrena el rànquing!',empty:'Encara no hi ha partides.',offline:'Sense connexió amb el rànquing. Reintentant…',title:'Kidney Mission · Rànquing en directe'}};
let LANG='es';try{const q=(location.hash||'').slice(1);LANG=q==='ca'||q==='es'?q:(localStorage.getItem('km_lang')||((navigator.language||'').toLowerCase().startsWith('ca')?'ca':'es'));}catch(e){}
const t=k=>TX[LANG][k];
function applyLang(){document.documentElement.lang=LANG;document.title=t('title');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('km_lang',LANG);}catch(e){}applyLang();seen=null;load();});
applyLang();
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const since=()=>{const d=new Date();d.setHours(0,0,0,0);return d.toISOString();};
const filt=()=>mode==='hoy'?`&created_at=gte.${encodeURIComponent(since())}`:'';
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
async function load(){
  const e=document.getElementById('err');
  if(!CFG.url||!CFG.key){e.textContent=t('noconf');document.getElementById('list').innerHTML=`<div class="empty">${t('notconf')}</div>`;return;}
  try{
    const [r,c]=await Promise.all([
      fetch(`${CFG.url}/rest/v1/scores?select=id,alias,score,pct,secs,created_at&order=score.desc,secs.asc,created_at.asc&limit=10${filt()}`,{headers:H}),
      fetch(`${CFG.url}/rest/v1/scores?select=id${filt()}`,{headers:{...H,Prefer:'count=exact',Range:'0-0'}})]);
    if(!r.ok)throw new Error(r.status);
    const l=await r.json();
    const tot=+((c.headers.get('content-range')||'').split('/')[1]);
    document.getElementById('cnt').textContent=isNaN(tot)?'–':tot;
    document.getElementById('rec').textContent=l[0]?l[0].score:'–';
    const ids=new Set(l.map(x=>x.id));
    document.getElementById('list').innerHTML=l.length?l.map((x,i)=>`<div class="r ${i<3?'g'+(i+1):''} ${seen&&!seen.has(x.id)?'new':''}"><span class="p">${i+1}</span><span class="n">${esc(x.alias)}</span><span class="a">${x.pct}% · ${mmss(x.secs)}</span><span class="s">${x.score}</span></div>`).join(''):
      `<div class="empty">${mode==='hoy'?t('emptyToday'):t('empty')}</div>`;
    seen=ids;e.textContent='';
  }catch(x){e.textContent=t('offline');}
}
function setMode(m){mode=m;seen=null;document.getElementById('tHoy').classList.toggle('on',m==='hoy');document.getElementById('tAll').classList.toggle('on',m!=='hoy');load();}
document.getElementById('tHoy').onclick=()=>setMode('hoy');
document.getElementById('tAll').onclick=()=>setMode('all');
load();setInterval(load,5000);
</script></body></html>
