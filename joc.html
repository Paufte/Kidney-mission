<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040a1c">
<title>Kidney Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Mission-control HUD: one dark navy world, turquoise = vital/success, electric blue = interface, single column mobile */
  --bg:#040a1c;
  --panel:#0b1736;
  --line:rgba(96,170,255,.20);
  --tq:#22e4c8;
  --blue:#2f7bff;
  --txt:#eef5ff;
  --mut:#93a8c8;
  --bad:#ff5d73;
  --warn:#ffb547;
  --f-disp:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow-x:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--tq);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60% 40% at 85% 0%,rgba(47,123,255,.22),transparent 70%),
   radial-gradient(50% 35% at 0% 100%,rgba(34,228,200,.14),transparent 70%),
   linear-gradient(rgba(96,170,255,.05) 1px,transparent 1px) 0 0/28px 28px,
   linear-gradient(90deg,rgba(96,170,255,.05) 1px,transparent 1px) 0 0/28px 28px,
   var(--bg)}
#app{position:relative;z-index:1;max-width:480px;overflow-x:clip;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#app.in>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#app.in>*:nth-child(2){animation-delay:.05s}
#app.in>*:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.mut{color:var(--mut)}
.eyebrow{font-family:var(--f-disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--tq)}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:14px;
  font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(100deg,var(--tq),var(--blue));color:#03122a;box-shadow:0 8px 28px -8px rgba(34,228,200,.55);transition:transform .15s,filter .15s}
.btn svg{width:22px;height:22px;flex:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{filter:grayscale(1) brightness(.5);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);box-shadow:none;letter-spacing:.08em;font-size:15px;min-height:50px}
.actions{position:sticky;bottom:0;padding-top:14px;margin-top:auto;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(transparent,var(--bg) 30%)}

.panel{background:linear-gradient(160deg,rgba(18,38,82,.85),rgba(8,18,44,.9));border:1px solid var(--line);border-radius:18px;padding:18px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.hud .tag{font-family:var(--f-disp);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .tag b{color:var(--tq);font-weight:700}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(11,23,54,.9);
  font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.isq{margin-left:0;color:#9fd8ff}
.pill svg{width:16px;height:16px}
.bar{height:4px;border-radius:4px;background:rgba(96,170,255,.15);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tq),var(--blue));transition:width .5s}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.15);color:var(--tq)}}

/* splash */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:6vh}
.logo{width:150px;height:170px;position:relative}
.logo svg{width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(34,228,200,.45))}
.logo .ring{position:absolute;inset:-14px;border:1px dashed rgba(34,228,200,.35);border-radius:50%;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{stroke-dasharray:160;stroke-dashoffset:160;animation:draw 2.4s ease-in-out infinite}
@keyframes draw{50%{stroke-dashoffset:0}100%{stroke-dashoffset:-160}}
.title{font-size:44px;line-height:.95;font-weight:700;letter-spacing:.06em}
.title span{display:block;background:linear-gradient(90deg,var(--tq),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:18px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}

/* intro */
.log{font-family:var(--f-disp);font-size:14px;color:var(--tq);letter-spacing:.08em}
.story p{font-size:19px;line-height:1.45}
.story p+p{margin-top:14px}
.note{display:flex;gap:10px;font-size:13.5px;color:var(--mut);border-left:3px solid var(--warn);padding:10px 12px;background:rgba(255,181,71,.06);border-radius:0 10px 10px 0}
.note b{color:var(--warn)}
.note.real{border-color:var(--tq);background:rgba(34,228,200,.06)}
.note.real b{color:var(--tq)}

/* map */
.map{display:flex;flex-direction:column;gap:0;position:relative}
.node{display:flex;gap:14px;align-items:stretch;position:relative}
.node .rail{display:flex;flex-direction:column;align-items:center;width:44px;flex:none}
.node .dot{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);font-family:var(--f-disp);font-weight:700;color:var(--mut)}
.node .dot svg{width:22px;height:22px}
.node .ln{flex:1;width:2px;background:var(--line);min-height:14px}
.node:last-child .ln{display:none}
.node .info{padding:2px 0 18px;flex:1}
.node .info h3{font-size:18px}
.node .info .code{font-family:var(--f-disp);font-size:11px;letter-spacing:.16em;color:var(--mut)}
.node .info p{font-size:14px;color:var(--mut)}
.node.done .dot{background:rgba(34,228,200,.14);border-color:var(--tq);color:var(--tq)}
.node.done .ln{background:var(--tq)}
.node.cur .dot{background:linear-gradient(135deg,var(--tq),var(--blue));color:#03122a;border:0;box-shadow:0 0 0 6px rgba(34,228,200,.15);animation:beat 1.8s infinite}
@keyframes beat{50%{box-shadow:0 0 0 11px rgba(34,228,200,.05)}}
.node.lock{opacity:.5}
.stars{color:var(--warn);letter-spacing:2px;font-size:13px}

/* learn */
.learn{flex:1;display:flex;flex-direction:column;gap:16px}
.lcard{flex:1;display:flex;flex-direction:column;gap:14px;min-height:300px}
.lcard .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(34,228,200,.1);border:1px solid rgba(34,228,200,.35);color:var(--tq)}
.lcard .ico svg{width:30px;height:30px}
.lcard h2{font-size:26px}
.lcard p{font-size:17px}
.lcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.lcard li{padding:12px 14px;border-radius:12px;background:rgba(47,123,255,.08);border:1px solid var(--line);font-size:15.5px}
.lcard li b{color:var(--tq);font-family:var(--f-disp);letter-spacing:.04em}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:all .3s}
.dots i.on{width:24px;background:var(--tq)}
.approx{display:inline-block;font-size:11px;font-family:var(--f-disp);letter-spacing:.06em;color:var(--warn);border:1px solid rgba(255,181,71,.5);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}

/* terms */
.term{background:none;border:0;padding:0;border-bottom:1.5px dotted var(--tq);color:var(--txt);font-weight:600}
#gloss{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(2,6,18,.6)}
#gloss.on{display:flex}
#gloss .box{width:100%;max-width:480px;margin:0 12px calc(env(safe-area-inset-bottom) + 12px);animation:rise .3s both}
#gloss h3{color:var(--tq);font-size:20px;margin-bottom:6px}

/* questions */
.ctx{font-size:15px;color:var(--mut);padding:12px 14px;border:1px dashed var(--line);border-radius:12px;margin-bottom:14px}
.ctx b{color:var(--txt)}
.q{font-size:23px;line-height:1.25;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(11,23,54,.85);font-size:16px;transition:border-color .2s,background .2s,transform .1s}
.opt:active{transform:scale(.99)}
.opt .ol{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px;background:rgba(47,123,255,.18);color:#a9c8ff}
.opt.ok{border-color:var(--tq);background:rgba(34,228,200,.12)}
.opt.ok .ol{background:var(--tq);color:#03122a}
.opt.no{border-color:var(--bad);background:rgba(255,93,115,.12)}
.opt.no .ol{background:var(--bad);color:#2a0710}
.opt.sel{border-color:var(--blue);background:rgba(47,123,255,.16)}
.opts.locked .opt{pointer-events:none}
.opts.locked .opt:not(.ok):not(.no){opacity:.45}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* timer */
.timer{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.timer .tb{flex:1;height:8px;border-radius:8px;background:rgba(96,170,255,.15);overflow:hidden}
.timer .tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--warn),var(--tq));transform-origin:left;transition:transform 1s linear}
.timer.low .tb i{background:var(--bad)}
.timer span{min-width:38px;text-align:right;font-weight:700}

/* true false */
.tfcard{min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;touch-action:pan-y;user-select:none;transition:transform .25s}
.tfcard .claim{font-size:21px;font-family:var(--f-disp);font-weight:600;line-height:1.3}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tfbtns button{min-height:62px;border-radius:14px;font-family:var(--f-disp);font-weight:700;letter-spacing:.1em;font-size:16px;border:1px solid}
.tfbtns .f{border-color:rgba(255,93,115,.6);background:rgba(255,93,115,.1);color:#ff9aa8}
.tfbtns .v{border-color:rgba(34,228,200,.6);background:rgba(34,228,200,.1);color:var(--tq)}
.hint{font-size:12.5px;color:var(--mut);text-align:center;margin-top:8px}

/* ABO */
.donor{display:flex;align-items:center;gap:14px}
.blood{width:64px;height:76px;flex:none;position:relative}
.blood svg{width:100%;height:100%}
.blood b{position:absolute;inset:22px 0 0;text-align:center;font-family:var(--f-disp);font-size:22px;color:#fff}
.abogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.abo{min-height:74px;border-radius:14px;border:1px solid var(--line);background:rgba(11,23,54,.85);font-family:var(--f-disp);font-size:26px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center}
.abo small{font-size:11px;letter-spacing:.12em;color:var(--mut);font-weight:500}
.abo.sel{border-color:var(--blue);background:rgba(47,123,255,.2);box-shadow:inset 0 0 0 1px var(--blue)}
.abo.ok{border-color:var(--tq);background:rgba(34,228,200,.14)}
.abo.no{border-color:var(--bad);background:rgba(255,93,115,.12)}

/* profiles */
.prof{display:flex;flex-direction:column;gap:10px}
.pcard{text-align:left;width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(11,23,54,.85);padding:14px;display:flex;flex-direction:column;gap:10px;transition:all .2s}
.pcard .ph{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;background:linear-gradient(135deg,#1c3a7a,#0f2350);border:1px solid var(--line);flex:none}
.pcard .ph h3{font-size:18px}
.pcard .ph p{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:rgba(47,123,255,.08);border-radius:10px;padding:7px 4px;text-align:center}
.stats small{display:block;font-size:10px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;line-height:1.2}
.stats b{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums}
.stats .neg{color:var(--tq)}.stats .pos{color:var(--bad)}
.pcard.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,123,255,.4)}
.pcard.ok{border-color:var(--tq);background:rgba(34,228,200,.1)}
.pcard.no{border-color:var(--bad);background:rgba(255,93,115,.08)}
.ficticio{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;color:var(--warn);border:1px solid rgba(255,181,71,.45);border-radius:6px;padding:3px 8px;margin-bottom:10px}

/* order */
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.slot{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;border:1px dashed var(--line);font-size:15px;text-align:left;width:100%;background:transparent}
.slot .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:13px;background:rgba(47,123,255,.15);color:#a9c8ff;flex:none}
.slot.fill{border-style:solid;background:rgba(47,123,255,.1)}
.slot.ok{border-color:var(--tq);background:rgba(34,228,200,.1)}
.slot.no{border-color:var(--bad);background:rgba(255,93,115,.1)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{padding:10px 14px;border-radius:12px;border:1px solid var(--blue);background:rgba(47,123,255,.12);font-size:15px;text-align:left}
.pool button.used{visibility:hidden;position:absolute}

/* body */
.bodywrap{display:flex;justify-content:center;margin:4px 0 8px}
.bodywrap svg{width:min(260px,70vw);height:auto;overflow:visible}
.zone{cursor:pointer;fill:rgba(47,123,255,.12);stroke:rgba(96,170,255,.55);stroke-width:1.5;stroke-dasharray:4 4;transition:all .2s}
.zone.sel{fill:rgba(47,123,255,.35);stroke:var(--blue);stroke-dasharray:none}
.zone.ok{fill:rgba(34,228,200,.3);stroke:var(--tq);stroke-dasharray:none}
.zone.no{fill:rgba(255,93,115,.25);stroke:var(--bad);stroke-dasharray:none}
.newk{opacity:0;transition:opacity .6s .2s}
.newk.on{opacity:1}
.zlabel{text-align:center;min-height:24px;font-family:var(--f-disp);color:var(--tq);letter-spacing:.04em}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match button{min-height:64px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(11,23,54,.85);font-size:14.5px;line-height:1.25}
.match .l button{border-left:4px solid var(--blue)}
.match .r button{border-right:4px solid var(--tq)}
.match button.sel{border-color:var(--blue);background:rgba(47,123,255,.22)}
.match button.done{border-color:var(--tq);background:rgba(34,228,200,.12);color:var(--tq);pointer-events:none}

/* patient */
.patient{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.patient .ph{display:flex;gap:12px;align-items:center}
.meter{display:grid;grid-template-columns:72px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.meter .tb{height:8px;border-radius:8px;background:rgba(96,170,255,.15);overflow:hidden}
.meter .tb i{display:block;height:100%;border-radius:8px;transition:width .7s}
.meter b{font-family:var(--f-disp);color:var(--txt);text-align:right;font-variant-numeric:tabular-nums}
.quote{position:relative;padding:14px 16px;border-radius:4px 16px 16px 16px;background:rgba(47,123,255,.14);border:1px solid rgba(47,123,255,.35);font-size:17px;margin-bottom:14px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(2,6,18,.55)}
#sheet.on{display:flex}
#sheet .box{width:100%;max-width:480px;max-height:86%;overflow:auto;border-radius:22px 22px 0 0;border-bottom:0;padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .35s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.fbh{display:flex;align-items:center;gap:12px}
.fbh .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.fbh .badge svg{width:24px;height:24px}
.fbh.ok .badge{background:var(--tq);color:#03122a}
.fbh.no .badge{background:var(--bad);color:#2a0710}
.fbh.info .badge{background:var(--warn);color:#2a1a00}
.fbh h3{font-size:22px}
.fbh .pts{margin-left:auto;font-family:var(--f-disp);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.fbh.ok .pts{color:var(--tq)}.fbh.no .pts{color:var(--bad)}
.fbt{font-size:16px}
.fbt p+p{margin-top:10px}
.fbt b{color:var(--tq)}

/* results */
.ring{width:170px;height:170px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--f-disp);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.ring .v small{color:var(--mut);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px;border-radius:14px;background:rgba(11,23,54,.85);border:1px solid var(--line)}
.kpi small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi b{font-family:var(--f-disp);font-size:26px;font-variant-numeric:tabular-nums}
.rank{text-align:center}
.rank h2{font-size:28px;background:linear-gradient(90deg,var(--tq),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.mrow:last-child{border:0}
.big{font-size:20px;line-height:1.4;font-family:var(--f-disp);font-weight:600}
a{color:var(--tq)}
.src{font-size:12.5px;color:var(--mut)}
.lang{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:rgba(11,23,54,.85)}
.lang button{border:0;background:none;color:var(--mut);font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.06em;padding:9px 18px;border-radius:9px;min-height:40px}
.lang button.on{background:linear-gradient(100deg,var(--tq),var(--blue));color:#03122a}
.lb{display:flex;flex-direction:column;gap:10px}
.lbform{display:flex;gap:8px}
.lbform input{flex:1;min-width:0;height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(4,10,28,.8);color:var(--txt);font:inherit;font-size:17px;padding:0 14px}
.lbform input:focus{outline:2px solid var(--tq);outline-offset:1px}
.lbform .btn{width:auto;min-height:52px;padding:0 18px;font-size:15px}
.lbrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.lbrow:last-child{border:0}
.lbrow .p{font-family:var(--f-disp);font-weight:700;color:var(--mut)}
.lbrow b{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.lbrow.me{color:var(--tq)}
.lbrow.me .p{color:var(--tq)}
.lbmsg{font-size:14px;color:var(--mut)}
.lbmsg.err{color:var(--bad)}
.reg{gap:12px}
.reg label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.reg input:not([type=checkbox]){height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(4,10,28,.8);color:var(--txt);font:inherit;font-size:17px;padding:0 14px;width:100%}
.reg input:focus{outline:2px solid var(--tq);outline-offset:1px}
.reg input.bad{border-color:var(--bad)}
.reg .chk{flex-direction:row;align-items:flex-start;gap:10px;font-size:14px;color:var(--txt);line-height:1.4}
.reg .chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--tq)}
.linkbtn{border:0;background:none;color:var(--tq);font:inherit;font-size:13px;text-decoration:underline;padding:4px 0;cursor:pointer}
</style>
</head>

const G_ES={
  erc:['Enfermedad renal crónica','Pérdida progresiva y permanente de la función de los riñones. En fase avanzada se necesita diálisis o trasplante para vivir.'],

  uci:['UCI','Unidad de Cuidados Intensivos: la zona del hospital donde se atiende a pacientes en estado crítico.'],
  me:['Muerte encefálica','Cese irreversible de todas las funciones del cerebro, incluido el tronco cerebral. Médica y legalmente es la muerte de la persona. No es un coma: en el coma el cerebro sigue funcionando.'],
  ont:['ONT','Organización Nacional de Trasplantes. Organismo público que coordina la donación y el trasplante de órganos en España.'],
  hla:['HLA','Antígenos leucocitarios humanos. Proteínas en la superficie de las células que funcionan como un carné de identidad para el sistema inmunitario. Se heredan de los padres.'],
  ac:['Anticuerpos','Proteínas de defensa que fabrica el sistema inmunitario para reconocer y atacar lo que considera extraño.'],
  pc:['Prueba cruzada (crossmatch)','Análisis que enfrenta la sangre del receptor con células del donante para comprobar si el receptor tiene anticuerpos contra ese donante concreto.'],
  hiper:['Paciente hiperinmunizado','Persona con muchos anticuerpos contra HLA, por transfusiones, embarazos o trasplantes previos. Le resulta mucho más difícil encontrar un donante compatible.'],

  fi:['Fosa ilíaca','Zona de la parte baja del abdomen, a cada lado, cerca del hueso de la cadera.'],
  ur:['Uréter','Tubo fino que lleva la orina desde el riñón hasta la vejiga.'],
  inj:['Injerto','El órgano trasplantado. Aquí, el riñón nuevo.'],
  inm:['Inmunosupresores','Medicamentos que reducen la actividad del sistema inmunitario para evitar que ataque al órgano trasplantado.']
};

/* ============ CONTENIDO ============ */
const MISSIONS_ES=[
{code:'THE DONOR',title:'El donante',tag:'El inicio de todo',icon:'heart',

  {icon:'users',h:'Dos tipos de donante',list:[

  {icon:'shield',h:'La coordinación de trasplantes',p:'Médicos y enfermeras del hospital que detectan posibles donantes, acompañan a la familia, comprueban que todo cumple la ley y organizan el proceso. En España todo se coordina con la {{ont|ONT}}.'}
 ],

      {x:'Buscar ya un receptor para sus riñones',fb:'Nadie busca receptores para alguien que está siendo tratado.'}],
   exp:'La prioridad absoluta es siempre el paciente. La posibilidad de donación solo se plantea en determinadas circunstancias, y nunca cambia el esfuerzo por salvarle.'},
  {t:'choice',ctx:'Pese a todos los tratamientos, el cerebro ha dejado de funcionar por completo.',
   q:'¿Quién diagnostica la {{me|muerte encefálica}}?',
   o:[{x:'Médicos que no forman parte del equipo de trasplante, con pruebas que marca la ley',ok:1},
      {x:'El equipo que va a hacer el trasplante',fb:'Si fuera así habría un conflicto de intereses. La ley lo prohíbe expresamente.'},
      {x:'La familia, cuando lo decide',fb:'La muerte es un diagnóstico médico con criterios y pruebas establecidos.'}],
   exp:'En España la ley exige que el diagnóstico lo hagan médicos ajenos a la extracción y al trasplante. La muerte encefálica es el cese irreversible de todas las funciones del cerebro: es la muerte de la persona y <b>no es un coma</b>.'},
  {t:'choice',q:'Ya se ha certificado el fallecimiento. ¿Cuál es el siguiente paso?',

  {t:'choice',q:'La familia confirma que él quería donar. ¿Qué se valora antes de aceptar la donación?',
   o:[{x:'Su historia clínica y pruebas para descartar enfermedades transmisibles y ver cómo funcionan sus órganos',ok:1},
      {x:'Solo la edad: a partir de cierta edad no se puede donar',fb:'No hay una edad límite fija. Cada caso se valora de forma individual.'},
      {x:'Nada: cualquier órgano sirve',fb:'Hay que proteger al receptor. Se estudia cada órgano antes de aceptarlo.'}],

  {t:'tf',items:[

{code:'FIND THE MATCH',title:'El receptor',tag:'Encontrar al receptor adecuado',icon:'dna',

  {icon:'drop',h:'Grupo sanguíneo (ABO)',p:'Igual que en una transfusión, el grupo del donante debe ser compatible con el del receptor. Si no lo es, el {{si|sistema inmunitario}} atacaría el riñón casi de inmediato.'},
  {icon:'dna',h:'HLA: tu huella inmunitaria',p:'Los {{hla|HLA}} son proteínas de tus células heredadas de tus padres. Cuanto más se parecen las del donante y las del receptor, mejor suele funcionar el trasplante a largo plazo. <b>No hace falta que coincidan todas.</b>'},
  {icon:'flask',h:'La prueba cruzada',p:'Justo antes del trasplante se enfrentan células del donante con la sangre del receptor. Si el receptor tiene {{ac|anticuerpos}} contra ese donante, la {{pc|prueba cruzada}} es <b>positiva</b> y normalmente no se trasplanta.'}
 ],
 steps:[

   exp:'Un riñón del grupo <b>A</b> puede ir a receptores <b>A</b> o <b>AB</b>. El grupo O es donante universal y el AB receptor universal. El factor Rh (+/−) no influye en la compatibilidad del trasplante renal. Aun así, muchos sistemas de asignación priorizan receptores del mismo grupo para no perjudicar a quienes son O, que solo pueden recibir de donantes O.'},
  {t:'profiles',donor:'A',
   pats:[

    {n:'Javier',d:'56 años · 4 años en diálisis',g:'A',hla:'3/6',pc:'Negativa',ok:1,why:'Javier es del grupo A y su prueba cruzada es negativa: no tiene anticuerpos contra este donante. Con 3 de 6 coincidencias HLA el trasplante es posible.'},
    {n:'Carmen',d:'41 años · 2 años en diálisis',g:'A',hla:'5/6',pc:'Positiva',ok:0,why:'Carmen tiene el grupo correcto y más coincidencias HLA, pero su prueba cruzada es positiva: sus anticuerpos atacarían este riñón.'}],
   exp:'<b>No basta con el grupo sanguíneo</b>, ni con tener muchas coincidencias HLA: la prueba cruzada debe ser negativa.'},
  {t:'choice',q:'¿Por qué Carmen puede tener anticuerpos contra el riñón de un donante?',

      {x:'Por ser del grupo sanguíneo A',fb:'El grupo sanguíneo no explica los anticuerpos contra HLA.'}],
   exp:'El contacto con células de otra persona puede generar anticuerpos anti-HLA. A estos pacientes se les llama {{hiper|hiperinmunizados}} y les cuesta mucho más encontrar un riñón. En España existe un programa nacional específico para ayudarles.'},
  {t:'tf',items:[
   {s:'Si donante y receptor tienen el mismo grupo sanguíneo, el trasplante ya es seguro.',a:0,exp:'Falso. También influyen el HLA, la prueba cruzada, la edad, el estado de salud y otros factores médicos.'},
   {s:'En la vida real, el coordinador elige libremente a qué paciente dar el riñón.',a:0,exp:'Falso. La asignación sigue criterios clínicos y protocolos oficiales: compatibilidad, urgencia médica, tiempo en lista, edad, programas para hiperinmunizados o criterios geográficos, entre otros. En España se organiza con la ONT. Este juego solo simplifica el razonamiento.'}]}
 ]},
{code:'AGAINST THE CLOCK',title:'Contrarreloj',tag:'El tiempo importa',icon:'clock',
 learn:[
  {icon:'clock',h:'Isquemia fría',p:'Es el tiempo que el riñón pasa fuera del cuerpo, enfriado y sin riego sanguíneo. <b>Cuanto más corto, mejor funcionará.</b> El riñón aguanta bastante más que el corazón, y en general se intenta que sean menos de 24 horas'+AP+'. Cada caso es distinto.'},
  {icon:'snow',h:'Cómo se conserva',p:'El riñón se lava con un líquido de preservación especial y se guarda a unos <b>4 °C</b> en bolsas estériles dentro de una nevera con hielo. Algunos hospitales usan máquinas que lo perfunden en frío. Nunca se congela.'},
  {icon:'team',h:'Un equipo enorme',p:'Coordinadores, intensivistas, cirujanos, anestesistas, nefrólogos, inmunólogos, enfermería y técnicos. También conductores y pilotos, y a veces fuerzas de seguridad para despejar el camino. Si un eslabón falla, se pierde tiempo.'}
 ],
 steps:[
  {t:'order',q:'Ordena las fases del proceso. Toca cada etapa en el orden correcto.',

   exp:'Primero se diagnostica la muerte, después se confirma la voluntad. Solo entonces se extrae el riñón, que se conserva en frío durante el transporte hasta el quirófano del receptor.'},
  {t:'story',icon:'clock',h:'Modo contrarreloj',p:'El riñón ya está fuera. El reloj de {{isq|isquemia fría}} está en marcha. Tienes <b>25 segundos</b> por decisión.<br><br>Responder bien vale mucho más que responder rápido: la rapidez solo da un pequeño extra.',btn:'Activar reloj'},
  {t:'choice',timed:25,isq:[1,3],q:'El riñón acaba de extraerse. ¿Cómo lo conservas?',
   o:[{x:'Líquido de preservación a unos 4 °C, en bolsas estériles y nevera con hielo',ok:1},
      {x:'Congelado a −20 °C para que aguante más',fb:'La congelación forma cristales de hielo que destruyen las células. El órgano quedaría inservible.'},
      {x:'A temperatura ambiente, bien tapado',fb:'Sin frío, las células consumen su energía rápidamente y el riñón se daña.'}],

      {x:'Cancelar el trasplante',fb:'Un retraso tiene solución si se coordina bien. Cancelar sería desperdiciar un órgano.'}],

  {t:'choice',timed:25,isq:[1,4],q:'Mientras el riñón viaja, ¿qué ocurre en el hospital receptor?',

 ]},
{code:'THE TRANSPLANT',title:'El trasplante',tag:'El momento decisivo',icon:'kidney',
 learn:[

  {icon:'immune',h:'El sistema inmunitario',p:'Es la defensa del cuerpo: reconoce lo que no es propio (virus, bacterias…) y lo ataca. Por eso puede reconocer el riñón donado como algo extraño.'},

 steps:[

const loc=s=>{if(LANG!=='ca'||typeof s!=='string')return s;for(const [a,b] of UI_CA)if(s.includes(a))s=s.split(a).join(b);return s;};

/* ============ ESTADO ============ */
const S={};
function reset(){Object.assign(S,{score:0,correct:0,total:0,m:0,li:0,si:0,sub:0,done:0,t0:Date.now(),t1:0,ms:MISSIONS.map(()=>({c:0,t:0,pts:0,bonus:0})),isq:2,pt:{k:70,w:60},final:false,sent:null,rid:null,regFails:0});}
reset();
window.KM={S,MISSIONS};

const $=s=>document.querySelector(s);
const app=$('#app');
let timers=[];
const clearTimers=()=>{timers.forEach(clearInterval);timers=[];};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function buzz(ok){try{navigator.vibrate&&navigator.vibrate(ok?18:[30,40,30]);}catch(e){}}

function render(html,after){
  clearTimers();
  app.classList.remove('in');
  app.innerHTML=loc(html);
  void app.offsetWidth;app.classList.add('in');
  window.scrollTo(0,0);
  after&&after();
}

/* puntuación: +100 por acierto (más un extra limitado en contrarreloj), −25 por fallo */
function award(ok,bonus){
  const ms=S.ms[S.m];let d;
  S.total++;ms.t++;
  if(ok){d=100+(bonus||0);S.correct++;ms.c++;}
  else{d=-Math.min(25,S.score);}
  S.score+=d;ms.pts+=d;
  buzz(ok);
  const p=$('#score');if(p){p.textContent=S.score;p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');}
  return d;
}

function hud(){
  const M=MISSIONS[S.m];
  const pct=Math.round(S.si/M.steps.length*100);

function stars(ms){if(!ms.t)return'';const r=ms.c/ms.t;return r===1?'★★★':r>=.7?'★★☆':'★☆☆';}

function map(){
  const nodes=MISSIONS.map((M,i)=>{
    const st=i<S.done?'done':i===S.done?'cur':'lock';
    const ms=S.ms[i];
    return `<div class="node ${st}"><div class="rail"><div class="dot">${st==='done'?ic('check',2.4):ic(M.icon)}</div><div class="ln"></div></div>
     <div class="info"><div class="code">MISIÓN ${i+1} · ${M.code}</div><h3>${M.title}</h3>
     <p>${st==='done'?`<span class="stars">${stars(ms)}</span> ${ms.c}/${ms.t} aciertos`:M.tag}</p></div></div>`;
  }).join('');
  render(`<div class="hud"><div class="tag"><b>PANEL</b> · Progreso de la misión</div><div class="pill">${ic('star')}<span id="score">${S.score}</span></div></div>

function learn(){
  const M=MISSIONS[S.m],c=M.learn[S.li],last=S.li===M.learn.length-1;
  const body=c.list?`<ul>${c.list.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`:`<p>${fmt(c.p)}</p>`;
  render(`<div class="row" style="padding:4px 0 14px"><div class="eyebrow">Misión ${S.m+1} · ${M.code}</div><div class="pill" style="margin-left:auto">${ic('star')}<span>${S.score}</span></div></div>
  ${S.li===0?`<div><h1 style="font-size:32px;margin-bottom:4px">${M.title}</h1><p class="mut" style="margin-bottom:14px">${M.tag}</p></div>`:''}
  <div class="learn"><div class="lcard panel"><div class="eyebrow">Briefing ${S.li+1}/${M.learn.length}</div><div class="ico">${ic(c.icon)}</div><h2>${c.h}</h2>${body}</div>
  <div class="dots">${M.learn.map((_,i)=>`<i class="${i===S.li?'on':''}"></i>`).join('')}</div></div>

}

function next(){S.sub=0;S.si++;if(S.si>=MISSIONS[S.m].steps.length)missionEnd();else step();}

/* --- elección (con o sin temporizador) --- */
function stChoice(st){
  const opts=shuffle(st.o);S.curOpts=opts;
  render(`${hud()}<div>
   ${st.pt?patientPanel():''}
   ${st.ctx?`<div class="ctx">${fmt(st.ctx)}</div>`:''}
   ${st.timed?`<div class="timer" id="tm">${ic('clock')}<div class="tb"><i id="tmb"></i></div><span id="tms">${st.timed}s</span></div>`:''}
   ${st.quote?`<div class="quote">${st.quote}</div>`:''}
   <h2 class="q">${fmt(st.q)}</h2>
   <div class="opts" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ol">${'ABC'[i]}</span><span>${o.x}</span></button>`).join('')}</div></div>`,()=>{
    let left=st.timed,answered=false;
    const answer=i=>{
      if(answered)return;answered=true;clearTimers();
      const box=$('#opts');box.classList.add('locked');
      const btns=[...box.children];
      opts.forEach((o,k)=>{if(o.ok)btns[k].classList.add('ok');});
      const o=i>=0?opts[i]:null,ok=!!(o&&o.ok);
      if(o&&!ok){btns[i].classList.add('no');btns[i].classList.add('shake');}
      let bonus=0;
      if(ok&&st.timed)bonus=Math.round(25*left/st.timed);
      const d=award(ok,bonus);
      if(st.isq){S.isq+=ok?st.isq[0]:st.isq[1];const e=$('#isq');if(e){e.textContent=S.isq+' h';e.parentNode.classList.add('pop');}}
      if(st.pt)updPatient(ok);
      const good=opts.find(x=>x.ok);
      let body='';
      if(i<0)body=`<p>Se acabó el tiempo. La respuesta correcta era: <b>${good.x}</b>.</p>`;
      else if(!ok)body=`<p>${o.fb||''}</p><p>Lo correcto: <b>${good.x}</b>.</p>`;
      body+=`<p>${st.exp}</p>`;
      if(ok&&bonus)body+=`<p class="mut">Incluye +${bonus} por rapidez.</p>`;
      setTimeout(()=>sheet(ok?'ok':'no',ok?'¡Correcto!':i<0?'Tiempo agotado':'No exactamente',d,body,null,next),i<0?200:450);
    };
    $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    if(st.timed){
      const bar=$('#tmb');
      timers.push(setInterval(()=>{
        left--;$('#tms').textContent=left+'s';bar.style.transform=`scaleX(${left/st.timed})`;
        if(left<=7)$('#tm').classList.add('low');
        if(left<=0)answer(-1);
      },1000));
    }
  });
}

/* --- verdadero / falso con gesto de deslizar --- */
function stTF(st){
  const it=st.items[S.sub];
  render(`${hud()}<div><div class="eyebrow" style="margin-bottom:10px">¿Verdadero o falso? · ${S.sub+1}/${st.items.length}</div>
   <div class="tfcard panel" id="card"><div class="mut" style="font-size:13px">AFIRMACIÓN</div><div class="claim">${it.s}</div></div>
   <div class="tfbtns"><button class="f" id="bf">${ic('x',2.4).replace('<svg','<svg width="18" height="18" style="vertical-align:-3px"')} FALSO</button><button class="v" id="bv">${ic('check',2.4).replace('<svg','<svg width="18" height="18" style="vertical-align:-3px"')} VERDADERO</button></div>
   <p class="hint">También puedes deslizar la tarjeta: izquierda falso, derecha verdadero.</p></div>`,()=>{
    let done=false;
    const card=$('#card');
    const ans=v=>{
      if(done)return;done=true;
      const ok=(v===!!it.a);
      card.style.transform=`translateX(${v?60:-60}px) rotate(${v?6:-6}deg)`;
      card.style.borderColor=ok?'var(--tq)':'var(--bad)';
      const d=award(ok);
      setTimeout(()=>sheet(ok?'ok':'no',ok?'¡Correcto!':'No exactamente',d,`<p>Era <b>${it.a?'VERDADERO':'FALSO'}</b>.</p><p>${it.exp}</p>`,null,()=>{
        S.sub++;if(S.sub<st.items.length)stTF(st);else next();
      }),300);
    };
    $('#bf').onclick=()=>ans(false);$('#bv').onclick=()=>ans(true);
    let x0=null,dx=0;
    card.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;card.style.transition='none';card.setPointerCapture(e.pointerId);});
    card.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;});
    const up=()=>{if(x0===null)return;x0=null;card.style.transition='';if(Math.abs(dx)>80)ans(dx>0);else card.style.transform='';};
    card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);
  });
}

/* --- ordenar fases --- */
function stOrder(st){
  const pool=shuffle(st.items.map((x,i)=>({x,i})));
  const placed=[];
  const draw=()=>{
    $('#slots').innerHTML=st.items.map((_,k)=>{const p=placed[k];return `<button class="slot ${p?'fill':''}" data-k="${k}"><span class="n">${k+1}</span><span>${p?p.x:'<span class="mut">…</span>'}</span></button>`;}).join('');
    $('#pool').innerHTML=pool.map((p,k)=>`<button data-k="${k}" class="${placed.includes(p)?'used':''}">${p.x}</button>`).join('');
    $('#go').disabled=placed.length<st.items.length;
    $('#slots').querySelectorAll('.slot').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(placed[k]){placed.splice(k,1);draw();}});
    $('#pool').querySelectorAll('button').forEach(b=>b.onclick=()=>{placed.push(pool[+b.dataset.k]);draw();});
  };
  render(`${hud()}<div><h2 class="q">${st.q}</h2><div class="slots" id="slots"></div><div class="eyebrow" style="margin-bottom:8px">Etapas disponibles</div><div class="pool" id="pool"></div>
  <p class="hint">Toca una etapa colocada para quitarla.</p></div>
  <div class="actions"><button class="btn" id="go" disabled>Comprobar orden</button></div>`,()=>{
    draw();
    $('#go').onclick=()=>{
      $('#go').disabled=true;
      const hits=placed.map((p,k)=>p.i===k);
      const ok=hits.every(Boolean);
      [...$('#slots').children].forEach((b,k)=>{b.onclick=null;b.classList.add(hits[k]?'ok':'no');});
      const d=award(ok);
      const body=(ok?'':`<p>Has acertado ${hits.filter(Boolean).length} de ${hits.length} posiciones. El orden correcto es:</p><p>${st.items.map((x,k)=>`${k+1}. ${x}`).join('<br>')}</p>`)+`<p>${st.exp}</p>`;
      setTimeout(()=>sheet(ok?'ok':'no',ok?'¡Secuencia perfecta!':'Casi',d,body,null,next),450);
    };
  });
}

   <ellipse class="zone" data-z="iliac" cx="64" cy="228" rx="22" ry="20"/>
   <ellipse class="zone" data-z="iliac" cx="136" cy="228" rx="22" ry="20"/>
  </svg></div><div class="zlabel" id="zl">&nbsp;</div><p class="hint">Vista frontal. El lado derecho del paciente aparece a tu izquierda.</p></div>
  <div class="actions"><button class="btn" id="go" disabled>Colocar el riñón aquí</button></div>`,()=>{
    let z=null;const zs=[...document.querySelectorAll('.zone')];
    zs.forEach(e=>e.addEventListener('click',()=>{z=e.dataset.z;zs.forEach(o=>o.classList.toggle('sel',o.dataset.z===z));$('#zl').textContent=loc(ZL[z]);$('#go').disabled=false;}));
    $('#go').onclick=()=>{
      $('#go').disabled=true;const ok=z==='iliac';
      zs.forEach(o=>{o.style.pointerEvents='none';o.classList.remove('sel');if(o.dataset.z==='iliac')o.classList.add('ok');else if(o.dataset.z===z)o.classList.add('no');});
      $('#nk').classList.add('on');
      const d=award(ok);
      const fb=ok?'':(z==='lumbar'?'<p>Ahí están los riñones propios, que normalmente se dejan en su sitio.</p>':'<p>En el tórax están el corazón y los pulmones.</p>');
      setTimeout(()=>sheet(ok?'ok':'no',ok?'¡Exacto!':'No es ahí',d,fb+`<p>${st.exp}</p>`,null,next),900);
    };
  });
}

/* --- emparejar conexiones --- */
function stMatch(st){
  const L=st.pairs.map((p,i)=>({x:p[0],i})),R=shuffle(st.pairs.map((p,i)=>({x:p[1],i})));
  let sel=null,errors=0,matched=0;
  render(`${hud()}<div><h2 class="q">${st.q}</h2>
  <div class="match"><div class="col l" id="ml">${L.map(o=>`<button data-i="${o.i}">${o.x}</button>`).join('')}</div>
  <div class="col r" id="mr">${R.map(o=>`<button data-i="${o.i}">${o.x}</button>`).join('')}</div></div>
  <div class="row" style="justify-content:space-between;margin-top:12px;font-size:13px" class="mut"><span class="mut">RIÑÓN NUEVO</span><span class="mut">RECEPTOR</span></div>
  <p class="hint" id="mh">Conexiones: 0/3</p></div>`,()=>{
    const lb=[...$('#ml').children],rb=[...$('#mr').children];
    lb.forEach(b=>b.onclick=()=>{sel=+b.dataset.i;lb.forEach(x=>x.classList.toggle('sel',x===b));});
    rb.forEach(b=>b.onclick=()=>{
      if(sel===null){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);return;}
      if(+b.dataset.i===sel){
        lb.find(x=>+x.dataset.i===sel).className='done';b.className='done';sel=null;matched++;
        $('#mh').textContent=loc(`Conexiones: ${matched}/3`);buzz(true);
        if(matched===3){
          const ok=errors===0,d=award(ok);
          setTimeout(()=>sheet(ok?'ok':'no',ok?'¡Riñón conectado!':'Conectado, con errores',d,(ok?'':`<p>Has necesitado ${errors} intento${errors>1?'s':''} de más.</p>`)+`<p>${st.exp}</p>`,null,next),400);
        }
      }else{errors++;b.classList.add('shake');buzz(false);setTimeout(()=>b.classList.remove('shake'),400);}
    });
  });
}

/* ============ FIN DE MISIÓN ============ */
function missionEnd(){
  const ms=S.ms[S.m],r=ms.c/ms.t;
  ms.bonus=r===1?100:r>=.7?50:0;
  S.score+=ms.bonus;ms.pts+=ms.bonus;
  S.done=Math.max(S.done,S.m+1);
  const last=S.m===MISSIONS.length-1;
  const extra=S.m===2?`<div class="note real"><span>${ic('snow')}</span><span><b>Isquemia fría de la partida: ${S.isq} h</b> (cifra del juego). ${S.isq<=8?'Muy buena coordinación.':S.isq<=14?'Aceptable, aunque se podía ganar tiempo.':'Demasiado larga: cada hora cuenta.'}</span></div>`:
    S.m===4?`<div class="note real"><span>${ic('life')}</span><span><b>Andrés:</b> riñón ${S.pt.k}/100, bienestar ${S.pt.w}/100. ${S.pt.k>=80?'Gracias a tus consejos, su riñón funciona muy bien.':'Algunos consejos han puesto en riesgo su riñón.'}</span></span></div>`:'';
  render(`<div class="stack" style="padding-top:20px;text-align:center;align-items:center">
   <div class="eyebrow">Misión ${S.m+1} completada</div>
   <div class="lcard" style="min-height:0;align-items:center"><div class="ico" style="width:72px;height:72px">${ic(MISSIONS[S.m].icon)}</div></div>
   <h1 style="font-size:32px">${MISSIONS[S.m].title}</h1>
   <div class="stars" style="font-size:26px">${stars(ms)}</div></div>
  <div class="kpis" style="margin-top:18px">
   <div class="kpi"><small>Aciertos</small><b>${ms.c}/${ms.t}</b></div>
   <div class="kpi"><small>Puntos misión</small><b>${ms.pts}</b></div>
   <div class="kpi"><small>Bonus misión</small><b style="color:var(--tq)">+${ms.bonus}</b></div>
   <div class="kpi"><small>Total</small><b>${S.score}</b></div></div>
  <div class="stack" style="margin-top:14px">${extra}<p class="mut" style="font-size:14px;text-align:center">${ms.bonus===100?'Misión perfecta: +100 de bonus.':ms.bonus?'Misión superada con nota: +50 de bonus.':'Sin bonus esta vez. Lo importante es lo que has aprendido.'}</p></div>
  <div class="actions"><button class="btn" id="go">${last?'Reflexión final':'Volver al panel'}</button></div>`,()=>{
    $('#go').onclick=last?reflection:map;
  });
}

function reflection(){
  render(`<div class="stack" style="padding-top:16px"><div class="eyebrow">Trasplante completado</div>
   <h1 style="font-size:30px">Todo empezó con una decisión generosa</h1></div>
   <div class="panel stack" style="margin-top:16px">
    <p class="big">Detrás de cada riñón trasplantado hay una persona que decidió donar y una familia que respetó su voluntad.</p>
    <p class="mut">Y decenas de profesionales que trabajaron coordinados contra el reloj.</p>
   </div>
   <div class="stack" style="margin-top:14px">
    <div class="note real"><span>${ic('users')}</span><span><b>Habla con tu familia.</b> Si un día llega el momento, serán quienes transmitan tu decisión. Que la conozcan es lo más importante.</span></div>
    <div class="note real"><span>${ic('heart')}</span><span><b>Un solo donante fallecido puede ayudar a varias personas.</b> Y un donante vivo puede cambiar la vida de alguien cercano.</span></div>
   </div>
   <div class="actions"><button class="btn" id="go">Ver resultados</button></div>`,()=>{$('#go').onclick=results;});
}


/* ============ RÀNQUING EN DIRECTO (Supabase, opcional) ============ */
const CFG=window.KM_CFG||{};
const LB_ON=!!(CFG.url&&CFG.key);
function sbHeaders(extra){const h={apikey:CFG.key,'Content-Type':'application/json'};if(/^eyJ/.test(CFG.key))h.Authorization='Bearer '+CFG.key;return Object.assign(h,extra||{});}
async function rpc(fn,args){
  const r=await fetch(`${CFG.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:sbHeaders(),body:JSON.stringify(args)});
  if(!r.ok)throw new Error(r.status);return r.json();
}
async function lbTop(n){
  const r=await fetch(`${CFG.url}/rest/v1/scores?select=alias,score,pct,secs,created_at&order=score.desc,secs.asc,created_at.asc&limit=${n}`,{headers:sbHeaders()});
  if(!r.ok)throw new Error(r.status);return r.json();
}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- registro antes de jugar ---- */
const tidy=v=>(v||'').replace(/\s+/g,' ').trim();
function register(){
  let P={};try{P=JSON.parse(localStorage.getItem('km_player')||'{}')||{};}catch(e){}
  const v=k=>esc(P[k]||'');
  render(`<div class="stack" style="padding-top:10px"><div class="eyebrow">Registro del concurso</div>
   <h2 style="font-size:26px">Antes de empezar</h2>
   <p class="mut">Para participar en el concurso necesitamos tus datos. Si ganas, te escribiremos al correo.</p></div>
  <form class="panel stack reg" id="regf" novalidate style="margin-top:14px">
   <label><span>Nombre</span><input id="rn" value="${v('n')}" maxlength="60" autocomplete="given-name" autocapitalize="words"></label>
   <label><span>Primer apellido</span><input id="ra1" value="${v('a1')}" maxlength="60" autocomplete="family-name" autocapitalize="words"></label>
   <label><span>Segundo apellido</span><input id="ra2" value="${v('a2')}" maxlength="60" autocomplete="off" autocapitalize="words"></label>
   <label><span>Correo electrónico</span><input id="rem" type="email" value="${v('e')}" maxlength="120" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"></label>
   <label class="chk"><input type="checkbox" id="rok" ${P.e?'checked':''}><span>Acepto que se guarden mis datos para gestionar el concurso, como se explica abajo.</span></label>
   <p class="lbmsg" id="rmsg" role="alert"></p>
   <button class="btn" type="submit" id="rgo">${ic('life',2.2)} Empezar la misión</button>
   ${P.e?'<button class="linkbtn" type="button" id="rclr">No soy yo: borrar mis datos de este móvil</button>':''}
   <button class="btn ghost" type="button" id="roff" style="display:${S.regFails>=2?'flex':'none'}">Jugar sin participar en el concurso</button>
  </form>
  <div class="note" style="margin-top:12px"><span>${ic('info')}</span><span><b>Privacidad.</b> Guardamos tu nombre, apellidos, correo, la hora de la partida y la puntuación solo para organizar el concurso y avisar a quien gane. Solo los ve la organización del stand, no se comparten con nadie y se borrarán al terminar el concurso. En el ranking público solo aparecen tu nombre y la inicial del primer apellido. Puedes pedir que los borremos en el stand.</span></div>
  <p class="src" style="text-align:center;margin-top:10px"><a href="#" id="rback">‹ Volver</a></p>`,()=>{
    const m=$('#rmsg');
    $('#rback').onclick=e=>{e.preventDefault();splash();};
    if($('#rclr'))$('#rclr').onclick=()=>{try{localStorage.removeItem('km_player');}catch(e){}register();};
    $('#roff').onclick=()=>{S.rid=null;S.t0=Date.now();intro();};
    $('#regf').onsubmit=async e=>{
      e.preventDefault();
      document.querySelectorAll('.reg input').forEach(i=>i.classList.remove('bad'));
      const d={n:tidy($('#rn').value),a1:tidy($('#ra1').value),a2:tidy($('#ra2').value),e:tidy($('#rem').value).toLowerCase()};
      const fail=(id,t)=>{if(id)$(id).classList.add('bad');m.className='lbmsg err';m.textContent=loc(t);if(id)$(id).focus();};
      if(!d.n)return fail('#rn','Escribe tu nombre.');
      if(!d.a1)return fail('#ra1','Escribe tus dos apellidos.');
      if(!d.a2)return fail('#ra2','Escribe tus dos apellidos.');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(d.e))return fail('#rem','Revisa el correo electrónico.');
      if(!$('#rok').checked)return fail(null,'Para participar tienes que aceptar la nota de privacidad.');
      $('#rgo').disabled=true;m.className='lbmsg';m.textContent=loc('Registrando…');
      try{
        const id=await rpc('km_registrar',{p_nombre:d.n,p_apellido1:d.a1,p_apellido2:d.a2,p_email:d.e,p_idioma:LANG,p_consentimiento:true});
        if(typeof id!=='string')throw new Error('id');
        try{localStorage.setItem('km_player',JSON.stringify(d));}catch(x){}
        S.rid=id;S.email=d.e;S.t0=Date.now();intro();
      }catch(x){
        S.regFails++;$('#rgo').disabled=false;fail(null,'No se ha podido registrar. Revisa la conexión e inténtalo de nuevo.');
        if(S.regFails>=2)$('#roff').style.display='flex';
      }
    };
  });
}

/* ---- ranking al final ---- */
function lbRows(list,me){return list.map((x,i)=>`<div class="lbrow ${me&&x.alias===me.alias&&x.score===me.score?'me':''}"><span class="p">${i+1}</span><span>${esc(x.alias)}</span><b>${x.score}</b></div>`).join('');}
function lbPanel(){
  if(!LB_ON)return '';
  return `<div class="panel lb" style="margin-top:12px" id="lb"><div class="row">${ic('trophy').replace('<svg','<svg width="26" height="26" style="color:var(--warn);flex:none"')}<h3 style="font-size:19px">Ranking en directo</h3></div>
   <p class="lbmsg" id="lbm"></p><div id="lbx"></div><div id="lbl"></div><a class="lbmsg" href="ranking.html" style="color:var(--tq)">Ver el ranking completo ›</a></div>`;
}
function lbBind(pct,sec){
  if(!LB_ON)return;
  const m=$('#lbm');
  const show=me=>lbTop(5).then(l=>{$('#lbl').innerHTML=l.length?lbRows(l,me):loc('<p class="lbmsg">Aún no hay puntuaciones. ¡Sé la primera persona!</p>');}).catch(()=>{});
  const done=()=>{m.className='lbmsg';m.innerHTML=loc(S.sent.pos?`¡Hecho, <b style="color:var(--tq)">${esc(S.sent.alias)}</b>! Estás en la posición <b style="color:var(--tq)">${S.sent.pos}</b>.`:'¡Puntuación enviada!')+'<br>'+loc('Puntuación guardada. Si ganas, te escribiremos a ')+`<b>${esc(S.email||'')}</b>.`;};
  if(S.sent){done();show(S.sent);return;}
  if(!S.rid){m.textContent=loc('Has jugado sin registrarte: esta partida no participa en el concurso.');show();return;}
  const send=async()=>{
    $('#lbx').innerHTML='';m.className='lbmsg';m.textContent=loc('Guardando tu puntuación…');
    try{
      const r=await rpc('km_finalizar',{p_id:S.rid,p_puntuacion:S.score,p_pct:pct,p_segundos:sec});
      S.sent={alias:r.alias,score:S.score,pos:r.posicion};done();show(S.sent);
    }catch(x){
      m.className='lbmsg err';m.textContent=loc('No se ha podido guardar la puntuación. Revisa la conexión y vuelve a intentarlo.');
      $('#lbx').innerHTML=loc('<button class="btn ghost" id="lbretry" type="button">Reintentar</button>');$('#lbretry').onclick=send;show();
    }
  };
  send();
}

/* ============ RESULTADOS ============ */
function results(){
  if(!S.final){S.final=true;S.t1=Date.now();S.score+=150;}
  const pct=S.total?Math.round(S.correct/S.total*100):0;
  const sec=Math.round((S.t1-S.t0)/1000),tm=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  const R=pct>=90?['Coordinación de élite','Has tomado decisiones con criterio de profesional. Ya sabes explicar cómo funciona un trasplante renal: compártelo.']:
    pct>=70?['Coordinación experta','Dominas lo esencial del proceso. Repasa los detalles que se te escaparon y estarás al nivel de los mejores.']:
    pct>=50?['Coordinación en formación','Vas por buen camino. Cada error de hoy es algo que ya no olvidarás. ¿Lo intentas otra vez?']:
    ['Primer turno de guardia','Nadie nace sabiendo: has descubierto un mundo complejo. Vuelve a jugar y verás cuánto has aprendido.'];
  const C=2*Math.PI*72;
  const rows=MISSIONS.map((M,i)=>`<div class="mrow"><span>${i+1}. ${M.title}</span><span><span class="stars">${stars(S.ms[i])}</span> <span class="mut">${S.ms[i].c}/${S.ms[i].t}</span></span></div>`).join('');
  render(`<div class="stack" style="padding-top:10px;text-align:center"><div class="eyebrow">Informe final de la misión</div></div>
  <div class="panel stack" style="margin-top:12px;gap:16px">
   <div class="ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="72" fill="none" stroke="rgba(96,170,255,.15)" stroke-width="12"/>
    <circle id="arc" cx="85" cy="85" r="72" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"/>
    <defs><linearGradient id="rg"><stop offset="0" stop-color="#22e4c8"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs></svg>
    <div class="v"><b id="tot">0</b><small>puntos</small></div></div>
   <div class="rank"><h2>${R[0]}</h2><p class="mut" style="margin-top:6px">${R[1]}</p></div>
  </div>
  <div class="kpis" style="margin-top:12px">
   <div class="kpi"><small>Aciertos</small><b>${pct}%</b></div>
   <div class="kpi"><small>Misiones</small><b>${S.done}/5</b></div>
   <div class="kpi"><small>Tiempo</small><b>${tm}</b></div>
   <div class="kpi"><small>Decisiones</small><b>${S.correct}/${S.total}</b></div></div>
  <div class="panel" style="margin-top:12px;padding:8px 16px">${rows}<div class="mrow"><span>Bonus por completar el juego</span><b style="color:var(--tq)">+150</b></div></div>
  ${lbPanel()}
  <div class="panel stack" style="margin-top:12px;border-color:rgba(34,228,200,.45)">
   <div class="row">${ic('heart').replace('<svg','<svg width="28" height="28" style="color:var(--tq);flex:none"')}<h3 style="font-size:19px">La donación salva vidas</h3></div>
   <p>Miles de personas esperan un riñón. Decidir ser donante y contárselo a tu familia es un gesto sencillo que puede devolver a alguien una vida sin diálisis.</p>
   <p class="mut" style="font-size:14px">Más información en la web de la Organización Nacional de Trasplantes: <a href="https://www.ont.es" target="_blank" rel="noopener">ont.es</a></p>
  </div>
  <p class="src" style="margin-top:12px">Contenido divulgativo basado en información de la ONT y de sociedades científicas de nefrología y trasplante. Los casos son ficticios y simplificados, y no sustituyen la valoración de profesionales sanitarios. Las cifras marcadas como orientativas varían según cada caso.</p>
  <div class="actions"><button class="btn" id="go">Volver a jugar</button></div>`,()=>{
    requestAnimationFrame(()=>setTimeout(()=>{$('#arc').style.strokeDashoffset=C*(1-pct/100);},60));
    const el=$('#tot'),T=S.score,t0=performance.now();
    const tick=t=>{const k=Math.min(1,(t-t0)/1200);el.textContent=Math.round(T*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
    $('#go').onclick=splash;
    lbBind(pct,sec);
  });
}

splash();
</script>
</body>
</html>
